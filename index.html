<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="服の違和感検知器 — コーデ写真を見て、色・明るさ・シルエットの違和感をチェックします。" />
  <title>服の違和感検知器</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">OUTFIT CHECK</p>
      <h1>服の違和感検知器</h1>
      <p class="lead">コーデ写真を入れて、気になるポイントをチェック。</p>
    </header>

    <section class="card">
      <label class="drop" for="photoInput" id="dropZone">
        <input id="photoInput" type="file" accept="image/*" />
        <span class="drop-icon">＋</span>
        <strong>コーデ写真を選ぶ</strong>
        <small>タップして画像をアップロード</small>
      </label>
      <div id="previewWrap" class="preview-wrap hidden">
        <img id="preview" alt="アップロードしたコーデ写真" />
        <button id="changeBtn" type="button" class="secondary">写真を変更</button>
      </div>
      <button id="analyzeBtn" class="primary" type="button" disabled>違和感をチェックする</button>
    </section>

    <section id="result" class="result hidden" aria-live="polite">
      <div class="result-head">
        <div>
          <p class="eyebrow">CHECK RESULT</p>
          <h2>本日の違和感チェック</h2>
        </div>
        <span id="overall" class="score">—</span>
      </div>
      <div id="checks" class="checks"></div>
      <p class="note">※これは画像の色・明るさ・構図などから機械的にチェックする簡易版です。服の素材や着用感まで正確に判定するものではありません。</p>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
